 <section id="skills" class="skills">
      <div class="container">
        <div class="section-eyebrow">Skills</div>
        <h2 class="section-heading">What I work with</h2>
        <p class="section-sub">Technologies I use daily to build production-grade full-stack applications.</p>

        <!-- Filter tabs -->
        <div class="skills__filters">
          <button
            *ngFor="let f of filters"
            class="filter-btn"
            [class.active]="activeFilter() === f.key"
            (click)="activeFilter.set(f.key)">
            <span class="filter-btn__icon" [innerHTML]="f.icon"></span>
            {{ f.label }}
            <span class="filter-btn__count">{{ getCount(f.key) }}</span>
          </button>
        </div>

        <!-- Skill cards -->
        <div class="skills__grid">
          <div class="skill-card"
               *ngFor="let cat of getFiltered()"
               [class.skill-card--highlight]="cat.highlight">

            <div class="skill-card__head">
              <div class="skill-card__icon" [innerHTML]="cat.icon"></div>
              <div class="skill-card__meta">
                <h3 class="skill-card__title">{{ cat.title }}</h3>
                <p class="skill-card__sub">{{ cat.sub }}</p>
              </div>
              <div class="skill-card__exp">{{ cat.exp }}</div>
            </div>

            <div class="skill-card__pills">
              <div class="skill-pill" *ngFor="let s of cat.skills" [class]="'skill-pill--' + s.level" [title]="getLevelLabel(s.level)">
                <span class="skill-pill__dot"></span>
                <span class="skill-pill__name">{{ s.name }}</span>
              </div>
            </div>

          </div>
        </div>

        <!-- Legend -->
        <div class="skills__legend">
          <span class="legend-title">Proficiency:</span>
          <span class="legend-item legend-item--high">
            <span class="legend-dot legend-dot--high"></span> Daily use
          </span>
          <span class="legend-item legend-item--mid">
            <span class="legend-dot legend-dot--mid"></span> Proficient
          </span>
          <span class="legend-item legend-item--low">
            <span class="legend-dot legend-dot--low"></span> Familiar
          </span>
        </div>

        <!-- Also know -->
        <div class="skills__also">
          <span class="skills__also-label">Also know:</span>
          <span class="pill" *ngFor="let t of also">{{ t }}</span>
        </div>

      </div>
    </section>
